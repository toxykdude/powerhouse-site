        - paragraph [ref=e20]: "Última actualización: Abril 2026"
        - text: \t\t\t
        - heading "1. Generalidades" [level=2] [ref=e21]
        - text: \t\t\t
        - paragraph [ref=e22]: PowerHouse Gym Manizales (en adelante "PowerHouse") es un gimnasio ubicado en la Avenida Santander, Parque de la Mujer, Manizales, Caldas, Colombia. Al utilizar nuestros servicios, aceptás los siguientes términos y condiciones.
        - text: \t\t\t
        - heading "2. Membresía" [level=2] [ref=e23]
        - text: \t\t\t
        - paragraph [ref=e24]: Nuestras membresías no requieren contrato de permanencia ni documentos adicionales. El pago se realiza por el período seleccionado (mensual, quincenal o diario) y vence automáticamente al finalizar dicho período. No hay renovación automática ni cargos recurrentes.
        - text: \t\t\t
        - heading "3. Uso de Instalaciones" [level=2] [ref=e25]
        - text: \t\t\t
        - paragraph [ref=e26]: El uso de las instalaciones de PowerHouse está sujeto a las normas internas del gimnasio, que incluyen el cuidado de los equipos, el respeto a otros usuarios y el seguimiento de las indicaciones del personal. PowerHouse se reserva el derecho de suspender el acceso a cualquier usuario que incumpla estas normas.
        - text: \t\t\t
        - heading "4. Responsabilidad" [level=2] [ref=e27]
        - text: \t\t\t
        - paragraph [ref=e28]: PowerHouse no se hace responsable por lesiones derivadas del uso inadecuado de los equipos o de no seguir las indicaciones del personal. Recomendamos siempre consultar con un profesional de la salud antes de iniciar cualquier programa de entrenamiento.
        - text: \t\t\t
        - heading "5. Horarios" [level=2] [ref=e29]
        - text: \t\t\t
        - paragraph [ref=e30]: "Nuestros horarios son: lunes a viernes de 5:00am a 10:00pm, sábados y domingos de 9:00am a 2:00pm. Los horarios pueden variar en días festivos y serán comunicados con anticipación."
        - text: \t\t\t
        - heading "6. Contacto" [level=2] [ref=e31]
        - text: \t\t\t
        - paragraph [ref=e32]: Para cualquier consulta sobre estos términos, podés contactarnos al WhatsApp +57 315 471 1900 o al correo gerencia@powerhousegym.co.
        - text: \t\t
      - text: \t
