      - link "$< Volver al inicio" [ref=e18] [cursor=pointer]:
        - /url: /
      - heading "Política de Privacidad" [level=1] [ref=e19]
      - paragraph [ref=e20]: "Última actualización: Abril 2026"
      - heading "1. Datos que Recopilamos" [level=2] [ref=e21]
      - paragraph [ref=e22]: "PowerHouse Gym Manizales recopila los datos mínimos necesarios para prestar nuestros servicios: nombre completo, número de teléfono, correo electrónico (opcional) y datos de pago. No solicitamos números de identificación ni documentos personales."
      - heading "2. Uso de los Datos" [level=2] [ref=e23]
      - paragraph [ref=e24]: "Utilizamos tus datos exclusivamente para: gestionar tu membresía, comunicar cambios en horarios o servicios, y enviar información relevante sobre promociones. No compartimos ni vendemos tus datos a terceros bajo ninguna circunstancia."
      - heading "3. Protección de Datos" [level=2] [ref=e25]
      - paragraph [ref=e26]: Implementamos medidas de seguridad técnicas y organizativas para proteger tus datos personales. Los pagos se procesan a través de plataformas seguras (Wompi) que cumplen con estándares PCI DSS.
      - heading "4. Derechos del Titular" [level=2] [ref=e27]
      - paragraph [ref=e28]: "De acuerdo con la Ley 1581 de 2012 (Ley de Protección de Datos Personales de Colombia), tenés derecho a: acceder a tus datos, solicitar su corrección, solicitar su eliminación, y revocar la autorización para su tratamiento."
      - heading "5. Cookies" [level=2] [ref=e29]
      - paragraph [ref=e30]: Nuestro sitio web utiliza cookies técnicas necesarias para su funcionamiento. No utilizamos cookies de rastreo publicitario ni compartimos datos de navegación con terceros.
      - heading "6. Contacto" [level=2] [ref=e31]
      - paragraph [ref=e32]: Para ejercer tus derechos sobre datos personales o cualquier consulta de privacidad, contactanos al correo gerencia@powerhousegym.co o al WhatsApp +57 315 471 1900.
