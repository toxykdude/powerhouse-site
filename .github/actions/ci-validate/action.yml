name: 'CI Validate'
description: 'Run lint, typecheck, test, build, and security audit. Expects Node 20 + npm ci already set up.'
runs:
  using: 'composite'
  steps:
    - name: Lint
      run: npm run lint
      shell: bash

    - name: Typecheck
      run: npm run typecheck 2>&1 | tail -5
      shell: bash
      # TODO: Remove continue-on-error once 14 pre-existing TS errors are fixed
      continue-on-error: true

    - name: Test
      run: npm test
      shell: bash

    - name: Build
      run: npm run build
      shell: bash

    - name: Security Audit
      run: npm audit --audit-level=high || true
      shell: bash
