name: mipago-env-doctor

# Ops tool for the mipago payment rail's Pages environment variables.
# Uses the repo's existing CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID
# secrets — no new credentials.
#
# Modes (workflow_dispatch input):
#   read — print the CURRENT non-secret mipago env vars on production
#          and preview (MIPAGO_API_URL, MIPAGO_ENABLED, MIPAGO_API_URL
#          overrides). Secret-typed vars are listed by NAME + type only.
#   fix  — set MIPAGO_API_URL to the `url` input on BOTH production and
#          preview, then print the resulting values. A redeploy
#          (rollback.yml) is required afterward for the Functions to
#          pick up the change — Pages env vars apply per deployment.
#
# NEVER print secret-typed values. Only MIPAGO_API_URL and MIPAGO_ENABLED
# (plain vars, not secrets) are echoed.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "read | fix | diag | sync-secret"
        required: true
        default: "read"
      url:
        description: "MIPAGO_API_URL value to set (fix mode only)"
        required: false
        default: "https://staging.mipago.online"
      payment_id:
        description: "Payment id for diag2 deep-dive"
        required: false
        default: "01M4Q590MJ1FMJ0YBH2XCNZ3BG"

concurrency:
  group: mipago-env-doctor
  cancel-in-progress: false

jobs:
  doctor:
    name: Read/fix mipago Pages env vars
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
      CF_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
      PROJECT: powerhouse-site
    steps:
      - name: Read current env vars
        run: |
          set -euo pipefail
          resp=$(curl -fsS -X GET \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}/pages/projects/${PROJECT}" \
            -H "X-Auth-Email: ${CF_EMAIL}" \
            -H "X-Auth-Key: ${CF_KEY}")
          for env_name in production preview; do
            echo "=== ${env_name} ==="
            echo "$resp" | jq -r --arg e "$env_name" '
              .result.deployment_configs[$e].env_vars // {}
              | to_entries
              | map(select(.key | startswith("MIPAGO")))
              | sort_by(.key)
              | .[]
              | if (.key | test("KEY|SECRET")) then
                  "\(.key) = <redacted, stored_type=\(.value.type)>"
                else
                  "\(.key) = \(.value.value)"
                end'
          done

      - name: Sync hub tenant callback secret (sync-secret mode only)
        if: ${{ github.event.inputs.mode == 'sync-secret' }}
        run: |
          set -euo pipefail
          # Read the secret the Pages Functions verify with — never printed.
          RESP_SYNC=$(curl -fsS -X GET \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}/pages/projects/${PROJECT}" \
            -H "X-Auth-Email: ${CF_EMAIL}" \
            -H "X-Auth-Key: ${CF_KEY}")
          SECRET_SYNC=$(echo "$RESP_SYNC" | jq -r '.result.deployment_configs.production.env_vars.MIPAGO_CALLBACK_SECRET.value // empty')
          if [ -z "$SECRET_SYNC" ]; then
            echo "::error::MIPAGO_CALLBACK_SECRET missing on Pages production"
            exit 1
          fi
          STAGING_DB="96ff0dc2-1ea3-4f31-aaee-dcd6bf09cedd"
          before=$(curl -fsS -X POST \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}/d1/database/${STAGING_DB}/query" \
            -H "X-Auth-Email: ${CF_EMAIL}" \
            -H "X-Auth-Key: ${CF_KEY}" \
            -H "Content-Type: application/json" \
            --data '{"sql": "SELECT LENGTH(callback_secret) AS len FROM tenants WHERE slug = '"'"'powerhouse'"'"'"}' \
            | jq -r '.result[0].results[0].len')
          curl -fsS -X POST \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}/d1/database/${STAGING_DB}/query" \
            -H "X-Auth-Email: ${CF_EMAIL}" \
            -H "X-Auth-Key: ${CF_KEY}" \
            -H "Content-Type: application/json" \
            --data "$(jq -n --arg s "$SECRET_SYNC" '{sql: "UPDATE tenants SET callback_secret = \($s | @json), updated_at = 1791781200000 WHERE slug = '"'"'powerhouse'"'"'"}')" \
            | jq -e '.result[0].success' >/dev/null && echo "UPDATE ok"
          after=$(curl -fsS -X POST \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}/d1/database/${STAGING_DB}/query" \
            -H "X-Auth-Email: ${CF_EMAIL}" \
            -H "X-Auth-Key: ${CF_KEY}" \
            -H "Content-Type: application/json" \
            --data '{"sql": "SELECT LENGTH(callback_secret) AS len FROM tenants WHERE slug = '"'"'powerhouse'"'"'"}' \
            | jq -r '.result[0].results[0].len')
          echo "callback_secret length: before=${before} after=${after} (value never printed)"
          echo "NOTE: hub retries re-sign per attempt, so pending callbacks recover automatically."

      - name: Diagnose hub-side state (diag mode only)
        if: ${{ github.event.inputs.mode == 'diag' }}
        run: |
          set -euo pipefail
          STAGING_DB="96ff0dc2-1ea3-4f31-aaee-dcd6bf09cedd"
          cf() {
            curl -fsS -X POST \
              "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}/d1/database/${1}/query" \
              -H "X-Auth-Email: ${CF_EMAIL}" \
              -H "X-Auth-Key: ${CF_KEY}" \
              -H "Content-Type: application/json" \
              --data "{\"sql\": $(echo "$2" | jq -Rs .)}"
          }
          echo "=== hub staging: last 12 payments (arrivals check) ==="
          cf "$STAGING_DB" \
            "SELECT id, reference, status, amount_cents, created_at FROM payments ORDER BY created_at DESC LIMIT 12" \
            | jq -c '.result[0].results[]'
          echo "=== hub staging: tenants (no secrets) ==="
          cf "$STAGING_DB" \
            "SELECT slug, status, callback_url, allowed_origins_json, LENGTH(callback_secret) AS cb_secret_len FROM tenants" \
            | jq -c '.result[0].results[]'
          echo "=== hub staging: api_keys shape (schema only) ==="
          cf "$STAGING_DB" \
            "SELECT sql FROM sqlite_master WHERE name = 'api_keys'" \
            | jq -r '.result[0].results[0].sql // "api_keys table not found"'
          echo "=== hub staging: payment + callback delivery (diag2) ==="
          cf "$STAGING_DB" \
            "SELECT id, reference, status, metadata_json, return_url FROM payments WHERE id = '${{ github.event.inputs.payment_id }}'" \
            | jq -c '.result[0].results[]'
          cf "$STAGING_DB" \
            "SELECT payment_id, event_type, status, attempts, last_error, next_attempt_at, datetime(next_attempt_at/1000, 'unixepoch') AS next_utc FROM tenant_callbacks WHERE payment_id = '${{ github.event.inputs.payment_id }}'" \
            | jq -c '.result[0].results[]'
          echo "=== hub staging: worker cron schedules ==="
          curl -fsS "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}/workers/scripts/mipago-staging/schedules" \
            -H "X-Auth-Email: ${CF_EMAIL}" \
            -H "X-Auth-Key: ${CF_KEY}" | jq -c '.result' || echo "schedules fetch failed"
          echo "=== FaceGYM pending consumption (diag2) ==="
          FGREF=$(cf "$STAGING_DB" \
            "SELECT json_extract(metadata_json, '$.facegym_reference') AS fg FROM payments WHERE id = '${{ github.event.inputs.payment_id }}'" \
            | jq -r '.result[0].results[0].fg // empty')
          if [ -n "$FGREF" ]; then
            echo "correlation reference: $FGREF"
            RESP_FOR_DIAG=$(curl -fsS -X GET \
              "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}/pages/projects/${PROJECT}" \
              -H "X-Auth-Email: ${CF_EMAIL}" \
              -H "X-Auth-Key: ${CF_KEY}")
            PORTAL_KEY=$(echo "$RESP_FOR_DIAG" | jq -r '.result.deployment_configs.production.env_vars.FACEGYM_PORTAL_INTERNAL_KEY.value // empty')
            if [ -n "$PORTAL_KEY" ]; then
              curl -s -o /tmp/fg-lookup.json -w "facegym pending lookup: HTTP %{http_code}\n" \
                "https://faceapp.powerhousegym.co/api/portal/pending-payment/${FGREF}" \
                -H "X-API-Key: ${PORTAL_KEY}"
              head -c 200 /tmp/fg-lookup.json; echo
            else
              echo "FACEGYM_PORTAL_INTERNAL_KEY not present in Pages env"
            fi
          else
            echo "payment row has no facegym_reference in metadata"
          fi

      - name: Fix MIPAGO_API_URL (fix mode only)
        if: ${{ github.event.inputs.mode == 'fix' }}
        run: |
          set -euo pipefail
          url="${{ github.event.inputs.url }}"
          if [[ ! "$url" =~ ^https://[a-z0-9.-]+[a-z0-9](/[a-zA-Z0-9._/-]*)?$ ]]; then
            echo "::error::Refusing to set MIPAGO_API_URL to non-https or malformed value: $url"
            exit 1
          fi
          echo "Setting MIPAGO_API_URL=$url on production + preview"
          cat > /tmp/patch.json <<JSON
          {
            "deployment_configs": {
              "production": { "env_vars": { "MIPAGO_API_URL": { "value": "$url" } } },
              "preview":    { "env_vars": { "MIPAGO_API_URL": { "value": "$url" } } }
            }
          }
          JSON
          curl -fsS -X PATCH \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}/pages/projects/${PROJECT}" \
            -H "X-Auth-Email: ${CF_EMAIL}" \
            -H "X-Auth-Key: ${CF_KEY}" \
            -H "Content-Type: application/json" \
            --data @/tmp/patch.json \
            | jq -e '.success' >/dev/null && echo "PATCH ok"

      - name: Verify result
        if: ${{ github.event.inputs.mode == 'fix' }}
        run: |
          set -euo pipefail
          resp=$(curl -fsS -X GET \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}/pages/projects/${PROJECT}" \
            -H "X-Auth-Email: ${CF_EMAIL}" \
            -H "X-Auth-Key: ${CF_KEY}")
          for env_name in production preview; do
            echo "=== ${env_name} (after fix) ==="
            echo "$resp" | jq -r --arg e "$env_name" '
              .result.deployment_configs[$e].env_vars // {}
              | to_entries
              | map(select(.key == "MIPAGO_API_URL"))
              | .[]
              | "\(.key) = \(.value.value)"'
          done
          echo "NOTE: dispatch rollback.yml (redeploy main) so the Functions pick this up."
