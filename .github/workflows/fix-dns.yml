name: Fix FaceGYM Portal DNS

on:
  workflow_dispatch:

jobs:
  fix-dns:
    runs-on: ubuntu-latest
    steps:
      - name: Update DNS for faceapp.powerhousegym.co to point to tunnel
        env:
          CF_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CF_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
        run: |
          ZONE="powerhousegym.co"
          TUNNEL_ID="1963914a-7c17-484d-95bf-72f7198c5e37"
          TARGET="${TUNNEL_ID}.cfargotunnel.com"

          # Get Zone ID
          ZONE_ID=$(curl -s "https://api.cloudflare.com/client/v4/zones?name=${ZONE}" \
            -H "X-Auth-Email: ${CF_EMAIL}" \
            -H "X-Auth-Key: ${CF_KEY}" \
            | jq -r '.result[0].id')
          echo "Zone ID: ${ZONE_ID}"

          # Get existing DNS record for faceapp.powerhousegym.co
          RECORD_RESPONSE=$(curl -s "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/dns_records?name=faceapp.${ZONE}" \
            -H "X-Auth-Email: ${CF_EMAIL}" \
            -H "X-Auth-Key: ${CF_KEY}")

          RECORD_COUNT=$(echo "$RECORD_RESPONSE" | jq '.result | length')

          if [ "$RECORD_COUNT" = "0" ]; then
            echo "No existing record. Creating CNAME..."
            curl -s -X POST \
              "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/dns_records" \
              -H "X-Auth-Email: ${CF_EMAIL}" \
              -H "X-Auth-Key: ${CF_KEY}" \
              -H "Content-Type: application/json" \
              --data "{\"type\":\"CNAME\",\"name\":\"faceapp\",\"content\":\"${TARGET}\",\"ttl\":1,\"proxied\":true}" \
              | jq '{success: .success, record: .result | {type, name, content, proxied}, errors: .errors}'
          else
            RECORD_ID=$(echo "$RECORD_RESPONSE" | jq -r '.result[0].id')
            RECORD_CONTENT=$(echo "$RECORD_RESPONSE" | jq -r '.result[0].content')
            echo "Found existing record: ${RECORD_ID} -> ${RECORD_CONTENT}"
            echo "Updating to point to tunnel..."
            curl -s -X PUT \
              "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/dns_records/${RECORD_ID}" \
              -H "X-Auth-Email: ${CF_EMAIL}" \
              -H "X-Auth-Key: ${CF_KEY}" \
              -H "Content-Type: application/json" \
              --data "{\"type\":\"CNAME\",\"name\":\"faceapp\",\"content\":\"${TARGET}\",\"ttl\":1,\"proxied\":true}" \
              | jq '{success: .success, record: .result | {type, name, content, proxied}, errors: .errors}'
          fi

      - name: Redeploy Pages to pick up env var
        run: |
          echo "Triggering redeploy..."
