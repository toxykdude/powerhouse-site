name: Deploy Production

on:
  push:
    branches: [main]

permissions:
  contents: write
  deployments: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: ./.github/actions/ci-validate

  deploy-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: validate
    environment: production
    permissions:
      contents: write
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Log deployment metadata
        run: |
          echo "=== Production Deployment ==="
          echo "Date: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "Commit: ${{ github.sha }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Author: ${{ github.actor }}"
          echo "Environment: production"

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy dist --project-name powerhouse-site

      - name: Ping IndexNow (Bing/Yandex instant indexing)
        run: |
          # Fetch every URL from the freshly deployed sitemap and submit to IndexNow.
          # The key file public/<key>.txt is deployed with the site (keys are public by design).
          KEY=$(basename dist/*.txt | grep -E '^[0-9a-f]{32}\.txt$' | sed 's/\.txt$//')
          if [ -z "$KEY" ]; then echo "No IndexNow key found; skipping"; exit 0; fi
          URLS=$(grep -o '<loc>[^<]*</loc>' dist/sitemap-0.xml | sed -e 's/<loc>//' -e 's/<\/loc>//')
          JSON=$(node -e "const u=process.argv[1].split('\n').filter(Boolean);console.log(JSON.stringify({host:'powerhousegym.co',key:process.argv[2],keyLocation:'https://powerhousegym.co/'+process.argv[2]+'.txt',urlList:u}))" "$URLS" "$KEY")
          CODE=$(curl -sS -o /dev/null -w "%{http_code}" -X POST https://api.indexnow.org/indexnow -H "Content-Type: application/json; charset=utf-8" --data-binary "$JSON")
          echo "IndexNow response: $CODE"
          # 200 = OK, 202 = accepted (queued); anything else is an error worth noticing but not failing the deploy
          if [ "$CODE" != "200" ] && [ "$CODE" != "202" ]; then echo "::warning::IndexNow returned $CODE"; fi

      - name: Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
        run: npx semantic-release

      - name: Log deployment result
        if: always()
        run: |
          echo "=== Deployment Result ==="
          echo "Status: ${{ job.status }}"
          echo "Commit: ${{ github.sha }}"
          echo "Environment: production"
          echo "Timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)"

  deploy-workers:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: validate
    environment: production
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check worker changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            workers:
              - 'workers/**'

      - name: Deploy contact worker (production)
        if: steps.filter.outputs.workers == 'true'
        env:
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.toml --env production

      - name: Deploy media proxy worker (production)
        if: steps.filter.outputs.workers == 'true'
        env:
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler-media.toml --env production
