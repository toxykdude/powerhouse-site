name: Update Cloudflare Pages env

on:
  workflow_dispatch:
    inputs:
      facegym_api_url:
        description: 'FACEGYM_API_URL value'
        required: true
        default: 'https://faceapp.powerhousegym.co'

jobs:
  update-env:
    runs-on: ubuntu-latest
    steps:
      - name: Update Pages environment variable
        env:
          CF_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CF_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "Updating FACEGYM_API_URL for powerhouse-site..."

          RESPONSE=$(curl -s -X PATCH \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}/pages/projects/powerhouse-site" \
            -H "X-Auth-Email: ${CF_EMAIL}" \
            -H "X-Auth-Key: ${CF_KEY}" \
            -H "Content-Type: application/json" \
            -d "{
              \"deployment_configs\": {
                \"production\": {
                  \"env_vars\": {
                    \"FACEGYM_API_URL\": {
                      \"value\": \"${{ github.event.inputs.facegym_api_url }}\"
                    }
                  }
                },
                \"preview\": {
                  \"env_vars\": {
                    \"FACEGYM_API_URL\": {
                      \"value\": \"${{ github.event.inputs.facegym_api_url }}\"
                    }
                  }
                }
              }
            }")

          echo "$RESPONSE" | python3 -m json.tool 2>/dev/null || echo "$RESPONSE"

          if echo "$RESPONSE" | grep -q '"success": true'; then
            echo "SUCCESS: FACEGYM_API_URL updated"
          else
            echo "WARN: success check failed, checking manually..."
            echo "$RESPONSE" | grep -o '"success":[[:space:]]*true' && echo "OK confirmed" || echo "FAILED"
          fi

      - name: Fix DNS for faceapp.powerhousegym.co
        env:
          CF_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CF_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          ZONE="powerhousegym.co"
          TUNNEL_ID="1963914a-7c17-484d-95bf-72f7198c5e37"
          TARGET_CNAME="${TUNNEL_ID}.cfargotunnel.com"

          # Get Zone ID
          ZONE_ID=$(curl -s "https://api.cloudflare.com/client/v4/zones?name=${ZONE}" \
            -H "X-Auth-Email: ${CF_EMAIL}" \
            -H "X-Auth-Key: ${CF_KEY}" | python3 -c "import json,sys; print(json.load(sys.stdin)['result'][0]['id'])")
          echo "Zone ID: ${ZONE_ID}"

          # Check existing DNS record
          DNS_RECORD=$(curl -s "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/dns_records?name=faceapp.${ZONE}" \
            -H "X-Auth-Email: ${CF_EMAIL}" \
            -H "X-Auth-Key: ${CF_KEY}")
          echo "Current DNS: ${DNS_RECORD}" | python3 -c "
          import json,sys
          data = json.load(sys.stdin)
          for r in data.get('result', []):
              print(f'  {r[\"type\"]} {r[\"name\"]} -> {r[\"content\"]} (id: {r[\"id\"]})')
          if not data.get('result'):
              print('  No records found')
          "

          # Delete existing records for faceapp.powerhousegym.co
          RECORD_IDS=$(echo "$DNS_RECORD" | python3 -c "
          import json,sys
          data = json.load(sys.stdin)
          for r in data.get('result', []):
              print(r['id'])
          ")
          for rid in $RECORD_IDS; do
            echo "Deleting record ${rid}..."
            curl -s -X DELETE "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/dns_records/${rid}" \
              -H "X-Auth-Email: ${CF_EMAIL}" \
              -H "X-Auth-Key: ${CF_KEY}" | python3 -c "import json,sys; d=json.load(sys.stdin); print('OK' if d.get('success') else d)"
          done

          # Create CNAME record pointing to tunnel (proxied)
          echo "Creating CNAME faceapp.${ZONE} -> ${TARGET_CNAME} (proxied)..."
          CREATE_RESPONSE=$(curl -s -X POST \
            "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/dns_records" \
            -H "X-Auth-Email: ${CF_EMAIL}" \
            -H "X-Auth-Key: ${CF_KEY}" \
            -H "Content-Type: application/json" \
            -d "{
              \"type\": \"CNAME\",
              \"name\": \"faceapp\",
              \"content\": \"${TARGET_CNAME}\",
              \"ttl\": 1,
              \"proxied\": true
            }")
          echo "$CREATE_RESPONSE" | python3 -c "
          import json,sys
          d = json.load(sys.stdin)
          if d.get('success'):
              r = d['result']
              print(f'SUCCESS: {r[\"type\"]} {r[\"name\"]} -> {r[\"content\"]} (proxied: {r[\"proxied\"]})')
          else:
              print(f'FAILED: {d}')
          "
