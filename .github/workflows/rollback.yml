name: Rollback

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Commit SHA, tag (e.g. v1.0.0), or release to restore"
        required: true
        type: string
      reason:
        description: "Why is this rollback needed?"
        required: true
        type: string

permissions:
  contents: read
  deployments: write

jobs:
  rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Log rollback metadata
        run: |
          echo "=== Rollback Initiated ==="
          echo "Triggered by: ${{ github.actor }}"
          echo "Target version: ${{ inputs.version }}"
          echo "Reason: ${{ inputs.reason }}"
          echo "Timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy dist --project-name powerhouse-site

      - name: Log rollback result
        if: always()
        run: |
          echo "=== Rollback Result ==="
          echo "Status: ${{ job.status }}"
          echo "Target: ${{ inputs.version }}"
          echo "Operator: ${{ github.actor }}"
          echo "Timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
